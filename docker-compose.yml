services:
  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: app-php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks: [appnet]

  web:
    image: nginx:stable-alpine
    container_name: app-nginx
    ports:
      - "8080:80" # http://localhost:8080
    volumes:
      - ./src:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks: [appnet]

  db:
    image: mysql:8.0
    container_name: app-mysql
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306" # evita conflito com MySQL local
    volumes:
      - dbdata:/var/lib/mysql
    networks: [appnet]

  node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    tty: true

volumes:
  dbdata:
  node_modules:

networks:
  appnet:
